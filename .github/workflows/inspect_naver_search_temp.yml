name: Inspect Naver Search Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect_naver_search_temp.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Search Naver API
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os, requests, re, html
          cid=os.environ.get('NAVER_CLIENT_ID','')
          sec=os.environ.get('NAVER_CLIENT_SECRET','')
          print('has_creds',bool(cid),bool(sec))
          headers={'X-Naver-Client-Id':cid,'X-Naver-Client-Secret':sec}
          for q in ['경기 드론쇼','경기 축제','수도권 드론쇼','고양 드론쇼','고양호수예술축제']:
              r=requests.get('https://openapi.naver.com/v1/search/news.json',headers=headers,params={'query':q,'display':20,'sort':'date'},timeout=30)
              print('\nQUERY',q,'status',r.status_code)
              if not r.ok:
                  print(r.text[:500]); continue
              for i,item in enumerate(r.json().get('items',[]),1):
                  title=html.unescape(re.sub('<.*?>','',item.get('title','')))
                  link=item.get('link','')
                  print(i,title,'|',link)
          PY
