name: Patch Event Search Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_event_search_temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Broaden event discovery
        run: |
          python - <<'PY'
          import json
          p='topics.json'
          topics=json.load(open(p,encoding='utf-8'))
          for t in topics:
              if t.get('name')=='🎪 행사·축제·공연':
                  additions=[
                      '드론쇼 축제',
                      '거리예술 축제 드론쇼',
                      '고양 드론쇼',
                      '고양 축제',
                      '고양호수예술축제',
                      '일산 드론쇼',
                      '일산 축제'
                  ]
                  terms=t.setdefault('search_terms',[])
                  for q in additions:
                      if q not in terms:
                          terms.append(q)
                  t['max_articles']=5
                  t['rules']=(t.get('rules','') + ' 고양·일산 등 경기 서북부를 포함한 수도권의 앞으로 열릴 드론쇼가 포함된 축제는 가족 나들이 가치가 높으므로 우선 선별한다. 기사 제목에 지역명이 없더라도 본문·요약에서 경기·서울·인천 행사임이 확인되면 포함한다.').strip()
          with open(p,'w',encoding='utf-8') as f:
              json.dump(topics,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topics.json
          git commit -m "Broaden 수도권 drone and festival discovery"
          git pull --rebase origin main
          git push origin HEAD:main
