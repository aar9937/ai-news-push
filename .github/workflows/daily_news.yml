name: Daily AI News Push

on:
  schedule:
    # 정기 요약
    - cron: '0 9 * * *'
      timezone: 'Asia/Seoul'
    - cron: '10 17 * * *'
      timezone: 'Asia/Seoul'

    # 긴급 확인: 오전 8:37부터 밤 10:37까지 2시간 간격
    - cron: '37 8-22/2 * * *'
      timezone: 'Asia/Seoul'

  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'digest'
        type: choice
        options:
          - digest
          - urgent

permissions:
  contents: write

concurrency:
  group: ai-news-history
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide run mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            if [ -z "$MODE" ]; then MODE="digest"; fi
          elif [ "${{ github.event.schedule }}" = "37 8-22/2 * * *" ]; then
            MODE="urgent"
          else
            MODE="digest"
          fi

          echo "RUN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Run mode: $MODE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests google-genai openai

      - name: Apply strict digest safeguards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main.py')
          s = p.read_text(encoding='utf-8')

          # Google News 수집부의 summary 미정의 오류 수정
          s = s.replace(
              'summary=summary,\n            link=getattr(entry, "link", ""),',
              'summary=clean_text(getattr(entry, "summary", "")),\n            link=getattr(entry, "link", ""),',
              1,
          )

          # 정기뉴스는 최종 후보 단계에서 발행시각이 확인된 최근 24시간 기사만 허용
          old = '''    # 주제별 완전 제외 항목을 AI 평가 전에 제거
              merged = [
                  article for article in merged
                  if not topic_item_blocked(
                      topic_name,
                      article.get("title", ""),
                      article.get("summary", ""),
                  )
              ]

              return dedupe_candidates(merged)'''

          new = '''    # 주제별 완전 제외 항목을 AI 평가 전에 제거
              merged = [
                  article for article in merged
                  if not topic_item_blocked(
                      topic_name,
                      article.get("title", ""),
                      article.get("summary", ""),
                  )
              ]

              if RUN_MODE == "digest":
                  cutoff_ts = int((datetime.now(KST) - timedelta(hours=24)).timestamp())
                  merged = [
                      article for article in merged
                      if int(article.get("published_ts", 0) or 0) >= cutoff_ts
                  ]

              return dedupe_candidates(merged)'''

          if old not in s:
              raise SystemExit('strict 24h patch target not found in main.py')
          s = s.replace(old, new, 1)

          # 버전 표시
          s = s.replace('BOT_VERSION = "v7-clean"', 'BOT_VERSION = "v8-strict24"', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Run news bot
        env:
          # RUN_MODE는 앞 단계에서 GITHUB_ENV로 설정되어 자동 전달됨

          # 기본 AI는 Gemini. Repository Variables에 AI_PROVIDER=openai를 넣으면 OpenAI로 전환 가능
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # 선택사항: 등록하면 국내 뉴스가 더 풍부해짐
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

          # 선택사항: 인천시 OpenAPI 키
          INCHEON_API_KEY: ${{ secrets.INCHEON_API_KEY }}

        run: python main.py

      - name: Save sent-news history
        shell: bash
        run: |
          if [ ! -f sent_news.json ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sent_news.json

          if git diff --cached --quiet; then
            echo "No sent-news changes to commit."
            exit 0
          fi

          git commit -m "Update sent news history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
