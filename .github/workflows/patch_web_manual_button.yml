name: Patch On-demand News Button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_web_manual_button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch web button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("아래 ‘지금 테스트’ 기능까지 쓰려면 Actions: Read and write도 추가하세요.", "아래 ‘지금 뉴스 받기’ 기능까지 쓰려면 Actions: Read and write도 추가하세요.")
          s = s.replace('지금 테스트 뉴스 보내기', '🔄 지금 뉴스 받기')
          s = s.replace('저장 후 눌러야 최신 설정으로 GitHub Actions가 실행됩니다.', '누르면 즉시 최근 30일에서 아직 받지 않은 유효한 뉴스를 찾아 텔레그램으로 보냅니다.')
          s = s.replace('body:JSON.stringify({ref:branch})', 'body:JSON.stringify({ref:branch,inputs:{mode:"manual"}})')
          s = s.replace('테스트 실행 요청 완료. 잠시 후 텔레그램을 확인하세요.', '뉴스 수집을 시작했어요. 잠시 후 텔레그램을 확인하세요.')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html
          git commit -m "Make mobile button run on-demand news scrape"
          git pull --rebase origin main
          git push origin HEAD:main
