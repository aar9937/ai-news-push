name: Daily AI News Push

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '10,25,40 8 * * *'
    - cron: '37 23 * * *'
    - cron: '37 1,3,5,7,9,11,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news-history
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide run mode
        shell: bash
        run: |
          MODE="digest"
          SKIP_RUN="false"
          IS_EVENING_DIGEST="false"
          SCHEDULE="${{ github.event.schedule }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="digest"
          elif [ "$SCHEDULE" = "37 23 * * *" ] || [ "$SCHEDULE" = "37 1,3,5,7,9,11,13 * * *" ]; then
            MODE="urgent"
          elif [ "$SCHEDULE" = "10,25,40 8 * * *" ]; then
            MODE="digest"
            IS_EVENING_DIGEST="true"

            KST_TODAY=$(TZ=Asia/Seoul date +%F)
            LAST_EVENING=""
            if [ -f .last_evening_digest ]; then
              LAST_EVENING=$(tr -d '\r\n' < .last_evening_digest)
            fi

            # GitHub may delay or miss an individual scheduled event. This cron fires
            # at 17:10, 17:25 and 17:40 KST. Once one succeeds, later runs skip.
            if [ "$LAST_EVENING" = "$KST_TODAY" ]; then
              SKIP_RUN="true"
              echo "Evening digest already delivered for $KST_TODAY; skipping fallback run."
            else
              echo "Evening digest not yet confirmed for $KST_TODAY; running now."
            fi
          fi

          echo "RUN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "SKIP_RUN=$SKIP_RUN" >> "$GITHUB_ENV"
          echo "IS_EVENING_DIGEST=$IS_EVENING_DIGEST" >> "$GITHUB_ENV"
          echo "Run mode: $MODE / skip: $SKIP_RUN / evening: $IS_EVENING_DIGEST"

      - name: Set up Python
        if: env.SKIP_RUN != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: env.SKIP_RUN != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests google-genai openai

      - name: Apply safe digest patch
        if: env.SKIP_RUN != 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'summary=summary,\n            link=getattr(entry, "link", ""),',
              'summary=clean_text(getattr(entry, "summary", "")),\n            link=getattr(entry, "link", ""),',
              1,
          )

          s = s.replace(
              'if candidate_is_old_duplicate(title, sent_fingerprints, sent_titles):\n            continue',
              'if RUN_MODE == "urgent" and candidate_is_old_duplicate(title, sent_fingerprints, sent_titles):\n            continue',
          )

          s = s.replace(
              '        if int(a.get("score", 0)) >= min_score\n        and a.get("applicability") != "LOW"',
              '        if a.get("applicability") != "LOW"',
              1,
          )

          s = s.replace(
              '        f"{badge} <b>중요도 {score}</b> · {app}",\n',
              '',
              1,
          )

          old_loader = '''def load_topics():
    topics = load_json(CONFIG_FILE, [])
    if not isinstance(topics, list) or not topics:
        raise ValueError("topics.json에 주제가 없습니다.")
    return topics'''
          new_loader = '''def load_topics():
    topics = load_json(CONFIG_FILE, [])
    if not isinstance(topics, list) or not topics:
        raise ValueError("topics.json에 주제가 없습니다.")
    extra_topics = load_json("extra_topics.json", [])
    if isinstance(extra_topics, list):
        topics.extend(extra_topics)
    return topics'''
          if old_loader in s:
              s = s.replace(old_loader, new_loader, 1)

          s = s.replace('BOT_VERSION = "v7-clean"', 'BOT_VERSION = "v10-market-news"', 1)
          p.write_text(s, encoding='utf-8')
          print('digest + market-news patch applied')
          PY

      - name: Run news bot
        if: env.SKIP_RUN != 'true'
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          INCHEON_API_KEY: ${{ secrets.INCHEON_API_KEY }}
        run: python main.py

      - name: Mark successful evening digest
        if: env.SKIP_RUN != 'true' && env.IS_EVENING_DIGEST == 'true' && success()
        shell: bash
        run: |
          TZ=Asia/Seoul date +%F > .last_evening_digest
          echo "Evening digest marked complete for $(cat .last_evening_digest)"

      - name: Save sent-news history and delivery marker
        if: env.SKIP_RUN != 'true' && success()
        shell: bash
        run: |
          git restore main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f sent_news.json ]; then
            git add sent_news.json
          fi
          if [ -f .last_evening_digest ]; then
            git add .last_evening_digest
          fi

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update news delivery state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
