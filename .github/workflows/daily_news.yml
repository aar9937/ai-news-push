name: Daily AI News Push

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_news.yml'
  schedule:
    - cron: '0 0 * * *'
    - cron: '10 8 * * *'
    - cron: '37 23,1,3,5,7,9,11,13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - digest
          - urgent

permissions:
  contents: write

concurrency:
  group: ai-news-history
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide run mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            if [ -z "$MODE" ]; then MODE="manual"; fi
          elif [ "${{ github.event.schedule }}" = "37 23,1,3,5,7,9,11,13 * * *" ]; then
            MODE="urgent"
          else
            MODE="digest"
          fi
          echo "RUN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Run mode: $MODE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests google-genai openai

      - name: Apply safe digest patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'summary=summary,\n            link=getattr(entry, "link", ""),',
              'summary=clean_text(getattr(entry, "summary", "")),\n            link=getattr(entry, "link", ""),',
              1,
          )

          s = s.replace(
              'if candidate_is_old_duplicate(title, sent_fingerprints, sent_titles):\n            continue',
              'if RUN_MODE in {"urgent", "manual"} and candidate_is_old_duplicate(title, sent_fingerprints, sent_titles):\n            continue',
          )

          s = s.replace(
              '        if int(a.get("score", 0)) >= min_score\n        and a.get("applicability") != "LOW"',
              '        if a.get("applicability") != "LOW"',
              1,
          )

          s = s.replace(
              '        f"{badge} <b>중요도 {score}</b> · {app}",\n',
              '',
              1,
          )

          old_loader = '''def load_topics():
    topics = load_json(CONFIG_FILE, [])
    if not isinstance(topics, list) or not topics:
        raise ValueError("topics.json에 주제가 없습니다.")
    return topics'''
          new_loader = '''def load_topics():
    topics = load_json(CONFIG_FILE, [])
    if not isinstance(topics, list) or not topics:
        raise ValueError("topics.json에 주제가 없습니다.")
    extra_topics = load_json("extra_topics.json", [])
    if isinstance(extra_topics, list):
        topics.extend(extra_topics)
    if RUN_MODE == "manual":
        manual_rule = (
            "[수동 즉시 스크랩 모드] 최근 30일(720시간) 안에서 아직 발송하지 않은 기사만 대상으로 한다. "
            "기사 보도일이 오늘과 가깝지 않아도 현재까지 내용이 바뀌지 않은 확정 사실, 통계, 정책, 가격·거래 데이터, "
            "일정·지원조건·개발계획처럼 지금도 유효한 정보라면 포함한다. 이후 공식 발표로 취소·변경·정정된 내용, "
            "현재는 효력이 끝난 이벤트·마감·행사, 이미 발송한 기사와 같은 사실을 반복하는 기사는 제외한다. "
            "오래된 기사일수록 현재도 유효하다는 근거가 제목·요약에 확인되는 경우만 선택한다. "
        )
        for topic in topics:
            topic["lookback_hours"] = 720
            topic["rules"] = manual_rule + str(topic.get("rules", ""))
    return topics'''
          if old_loader in s:
              s = s.replace(old_loader, new_loader, 1)

          s = s.replace('HISTORY_DAYS = 7', 'HISTORY_DAYS = 30', 1)
          s = s.replace('BOT_VERSION = "v7-clean"', 'BOT_VERSION = "v11-on-demand"', 1)

          p.write_text(s, encoding='utf-8')
          print('digest + market-news + on-demand patch applied')
          PY

      - name: Run news bot
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          INCHEON_API_KEY: ${{ secrets.INCHEON_API_KEY }}
        run: python main.py

      - name: Save sent-news history
        shell: bash
        run: |
          if [ ! -f sent_news.json ]; then
            exit 0
          fi

          git restore main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_news.json

          if git diff --cached --quiet; then
            echo "No sent-news changes to commit."
            exit 0
          fi

          git commit -m "Update sent news history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
